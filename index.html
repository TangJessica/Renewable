  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      fetch("/api/track-visitor");
    </script>
    <script>
      const sessionId = crypto.randomUUID();
      const startTime = Date.now();
      let engaged = false;
    
      // Log visit ONCE
      fetch(`/api/track-visitor?sid=${sessionId}`);
    
      function markEngaged() {
        if (engaged) return; // prevents double firing
        engaged = true;
    
        const duration = Math.round((Date.now() - startTime) / 1000);
    
        fetch(`/api/engagement`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, duration })
        });
      }
    
      window.addEventListener("scroll", markEngaged, { once: true });
      window.addEventListener("click", markEngaged, { once: true });
      setTimeout(markEngaged, 8000);
    </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      const carousel = new bootstrap.Carousel('#myCarousel', {
        interval: 3000,
        pause: 'hover'
      })
    </script>
  </body>
